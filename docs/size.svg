<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; dominant-baseline: central; font-variant-numeric: tabular-nums; }
  .card { fill: #fbfaf7; stroke: #dcd9d2; }
  .title { fill: #23262c; font-size: 18px; font-weight: 600; }
  .sub { fill: #7a7f88; font-size: 13px; }
  .name { fill: #2e3138; font-size: 14px; }
  .value { fill: #7a7f88; font-size: 13px; }
  .bar { fill: #d6d3cb; }
  .band { fill: #2f6fde; fill-opacity: 0.08; }
  .us { fill: #2f6fde; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .card { fill: #111316; stroke: #262930; }

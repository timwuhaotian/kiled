    .sub, .value { fill: #7d8490; }
    .name { fill: #d7dae0; }
    .bar { fill: #31353d; }
    .band { fill: #6ca8ff; fill-opacity: 0.10; }
    .us { fill: #6ca8ff; }
  }
</style>

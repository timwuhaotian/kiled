name: Feature request
description: Something Kiled should do. Kiled edits code and nothing else; a terminal, git or plugins are out of scope.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. VS Code or other editors that do it well are useful pointers.
